<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>4E Quick Rolls</title>
  <link rel="stylesheet" href="./style-v080.css">
</head>
<body>
  <main class="panel">
    <header>
      <div class="headerTitle"><strong>Quick Rolls</strong><span id="editTitle" class="editTitle"></span></div>
      <div class="headerActions">
        <button id="dragHandle" class="headerButton dragHandle" type="button" title="Przeciągnij panel">MOVE</button>
        <button id="editToggle" class="headerButton" type="button" title="Ustawienia wszystkich makr">EDIT</button>
      </div>
    </header>
    <section id="rollView" class="rollView"><div id="customButtons" class="grid"></div></section>
    <section id="editView" class="editView hidden">
      <div id="fields"></div>
      <div class="editActions"><button id="cancel" type="button">Anuluj</button><button id="save" class="primary" type="button">Zapisz</button></div>
    </section>
    <div id="status" class="status" aria-live="polite"></div>
  </main>
  <script type="module" src="./panel-v080.js"></script>
</body>
</html>
